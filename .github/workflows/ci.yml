# Shape adapted from plainkeep .github/workflows/ci.yml (gabros20/plainkeep@d7eb27e), ADR-0003.
# CI for plainport (ADR-0020, ADR-0021): runs on every push to main, on every v* tag push and by hand. A red run
# on main stops the next phase until it is fixed. scripts/ci-workflow.test.ts pins the parts ADR-0020 requires.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to .bun-version, never `latest`, so CI tests the toolchain the code was written against.
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pnpm and Yarn Classic
        # The hydration tests run real offline installs (npm, pnpm, Yarn Classic, Bun) against vendored tarballs;
        # under CI a missing manager fails them rather than skipping (packages/eco-node/src/hydrate.test.ts).
        run: npm install -g pnpm@10.32.1 yarn@1.22.22
      - run: bun run check:bun
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: generated contract files are fresh
        # plainport.json, schemas/ and completions/ are generated from the command registry; never edited by hand.
        run: bun run contract --check
      - run: bun run test
      - name: test:t1 (real restic and rclone)
        # fetch-tools downloads the restic and rclone tools.lock.json pins and refuses any checksum mismatch.
        run: |
          bun scripts/fetch-tools.ts
          bun run test:t1
      - run: bun run build
      - name: binary prints its version
        run: |
          out="$(./dist/plainport --version)"
          echo "$out"
          test "$out" = "plainport $(cat VERSION)"

  linux:
    runs-on: ubuntu-24.04
    # T2 waits on Docker; a wedged daemon or a stalled pull must not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: install zsh
        # The re-run quoting test parses the line in real zsh and bash; the runner image has no zsh.
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pnpm and Yarn Classic
        # The hydration tests run real offline installs (npm, pnpm, Yarn Classic, Bun) against vendored tarballs;
        # under CI a missing manager fails them rather than skipping (packages/eco-node/src/hydrate.test.ts).
        run: npm install -g pnpm@10.32.1 yarn@1.22.22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: fetch the pinned restic and rclone
        run: bun scripts/fetch-tools.ts
      - name: T2 containers (compose.yaml)
        # ubuntu-24.04 has Docker; GitHub's macOS runners do not, so T2 runs only here (ADR-0018).
        run: scripts/testenv up
      - name: test:t2 (T1 real restic and rclone, and the T2 store containers)
        run: bun run test:t2
      - name: T2 container logs
        if: failure()
        run: scripts/testenv logs
      - name: take the T2 containers down
        if: always()
        run: scripts/testenv down
      - run: bun run build
      - name: binary prints its version
        run: |
          out="$(./dist/plainport --version)"
          echo "$out"
          test "$out" = "plainport $(cat VERSION)"
      - name: compile smoke for every release target
        # Cross-compiled with Bun; only the runner's native binary is run (above and in the macos job).
        run: |
          bun scripts/build.ts --target all
          ls -l dist/plainport-*

  restic-matrix:
    # engine-restic's T1 suite on every restic plainport supports: the latest 0.18 and the pin (ADR-0021; 0.18.0 or
    # later since run decision D93).
    # tools.lock.json's `matrix` section holds their checksums; fixtures/restic/<version>/ their recorded output.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 0.19.1 is the pin, which the linux job's test:t2 also covers; its row here documents the pin beside the
        # older versions, so the matrix states every restic plainport supports.
        restic: ["0.18.1", "0.19.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: fetch restic ${{ matrix.restic }} (refuses a checksum mismatch)
        run: bun scripts/fetch-tools.ts --restic ${{ matrix.restic }}
      - name: engine-restic T1 on restic ${{ matrix.restic }}
        run: bun test packages/engine-restic
        env:
          PLAINPORT_TEST_TIER: "1"
          PLAINPORT_RESTIC_MATRIX: ${{ matrix.restic }}

  version:
    # VERSION, CHANGELOG.md, every `release: X.Y.Z` commit and every v* tag must agree (ADR-0020). It checks the
    # whole history, so the release commit is covered even when the next -dev commit is pushed with it, and a
    # tag push is checked against VERSION at the tagged commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun run check:version

  secrets:
    # gitleaks over the whole history, from the same pinned Docker image `bun run secrets` uses locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun run secrets
